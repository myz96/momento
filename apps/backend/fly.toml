# Fly.io config. Secrets (MOMENTO_R2_*, MOMENTO_API_KEY) are set with
# `fly secrets set`, never in this file.
app = "momento-backend"
primary_region = "syd"

# Days group in the household timezone on every client (CLI and MCP).
[env]
  MOMENTO_TZ = "Australia/Sydney"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

# 1 GB fits the whisper model (base.en int8) with headroom for frame
# extraction; auto-stop keeps the bigger machine cheap.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
