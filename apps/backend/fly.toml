# Fly.io config. Secrets (MOMENTO_R2_*, MOMENTO_API_KEY) are set with
# `fly secrets set`, never in this file.
app = "momento-backend"
primary_region = "syd"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
